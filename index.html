<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paçacı Zihni | Menü</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #968387;
    }

    .menu-wrap {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .menu {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div class="menu-wrap">
    <img
      class="menu"
      src="./menu.png"
      alt="Paçacı Zihni Menü"
    >
  </div>
</body>
</html>
